# node_stats-targeted server questions, dev. Labelled before any candidate, science seat.
cases:
  - {q: "is kai-server running out of disk", server: [tailnet_coilyco_node_stats_kai_server], tool: [get_disk_info, get_filesystem_pressure]}
  - {q: "which pods are crashlooping on ser8", server: [tailnet_coilyco_node_stats_ser8], tool: [get_k3s_pods, get_k3s_events]}
  - {q: "cpu load on kai-server right now", server: [tailnet_coilyco_node_stats_kai_server], tool: [get_cpu_info, get_system_snapshot, get_top_processes]}
  - {q: "what's eating memory on ser8", server: [tailnet_coilyco_node_stats_ser8], tool: [get_memory_info, get_top_processes, get_k3s_container_memory]}
  - {q: "any k3s warning events on kai-server", server: [tailnet_coilyco_node_stats_kai_server], tool: [get_k3s_events]}
  - {q: "which persistent volumes are nearly full on ser8", server: [tailnet_coilyco_node_stats_ser8], tool: [get_k3s_volume_usage, get_k3s_storage_claims]}
  - {q: "what cron jobs run on kai-server's cluster", server: [tailnet_coilyco_node_stats_kai_server], tool: [get_k3s_scheduled_work]}
  - {q: "is the node healthy", server: [tailnet_coilyco_node_stats_kai_server, tailnet_coilyco_node_stats_ser8], tool: [get_k3s_node_health, get_system_snapshot]}
  - {q: "show error logs from eco-app over the last hour", server: [tailnet_coilyco_signoz], tool: [signoz_search_logs, signoz_aggregate_logs]}
  - {q: "is the enshrouded server up", server: [tailnet_coilyco_enshrouded], tool: [get_status]}
  - {q: "latency of agent-proxy requests today", server: [tailnet_coilyco_signoz], tool: [signoz_aggregate_traces, signoz_query_metrics, signoz_get_service_top_operations]}
