# Call-site half of the Jev routing question. The tool prose belongs to eco-app.
# Science seat draft, 2026-09-25. Owned by sirens-echo once the router lands there.
instructions: >-
  A player in the Sirens Eco community asked the message in state. Which single
  Eco data tool best answers it? Pick no_tool when no tool's data can answer it.
context: >-
  Questions come from the Sirens Eco server's Discord and in-game chat. An
  unqualified question is about the game Eco on the Sirens server.
extra_options:
  no_tool: >-
    No Eco data tool answers this. Game mechanics and how-to, client crashes and
    bug reports, wipe or patch schedules, requests addressed to a specific
    person, and anything not about Eco.
