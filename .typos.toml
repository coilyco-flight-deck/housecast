# Evaluation records preserve raw model responses verbatim, so a spelling
# correction inside a preserved answer would edit the evidence. Words that
# only appear inside preserved answers are accepted rather than rewritten.
# LICENSE-FONTS is upstream text and its axis tags are not misspellings.
[default.extend-words]
wdth = "wdth"
wght = "wght"
mis = "mis"
unparseable = "unparseable"
RTO = "RTO"
# machine-kai-ser8 is a machine name that appears in preserved run output.
ser = "ser"

# Commit refs, sha256 prefixes and trace ids are hex, so a letter run inside one
# is not a misspelling. Scoped to tokens carrying a digit, because that is what
# separates a digest from an English word spelled out of a-f.
[default]
extend-ignore-re = ["\\b[0-9a-f]*[0-9][0-9a-f]*\\b"]
