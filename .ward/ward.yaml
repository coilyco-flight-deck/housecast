# Catalog metadata for the cross-repo knowledge graph.
#
# Dev verbs used to live here as a `commands:` block. They are recipes in the
# justfile now. This file survives only because check_catalog_block pins this
# exact path and catalog-trifecta wants README, AGENTS, and FEATURES to link
# it, both upstream in agentic-os.

security: {}

catalog:
  description: "Agent context, cast from one roster. Change what a role may do and the evaluation that checks it moves with it, in the same commit. Reads roles, personalities, and boundaries authored as YAML, resolves each role's personality meld and boundary allocation, and emits an immutable bundle it also grades through the evalkit board runner. Upstream of acompose, which renders that bundle into harness surfaces. Installed from Forgejo with uv, not published to PyPI."
  dependsOn: []
