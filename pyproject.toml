[project]
name = "housecast"
dynamic = ["version"]
description = "Python composition engine for agent rosters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kai Siren" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The engine needs only a YAML parser. Everything heavier belongs to the eval
# runner, which travels with it but is not what a consumer composing a bundle
# has to install.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# The grading half is housecast.grade and the runner is evalkit. Both ride this
# extra, so a consumer composing a bundle installs neither.
eval = [
    "click>=8.1",
    "pydantic>=2.9",
    "rich>=13",
    "inspect-ai>=0.3.255",
    "openai>=2.53.0",
    # `housecast grade serve`. Both were already in the resolution as transitive
    # deps of inspect-ai, so naming them directly costs nothing new to install.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
housecast = "housecast.__main__:main"

[project.urls]
Homepage = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    # starlette's TestClient is an httpx client, so the serve tests need it.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is single-sourced from the package. Keeping it in both places
# drifted twice inside one migration: the tag said 0.1.3 and the metadata said
# 0.1.1, and nothing failed because a git dependency does not check.
[tool.hatch.version]
path = "housecast/__init__.py"

[tool.hatch.build.targets.wheel]
# py.typed ships so a consumer under mypy strict gets the types rather than an
# import-untyped error. Both packages are strict-clean here.
packages = ["housecast", "evalkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["housecast", "evalkit"]

[tool.pytest.ini_options]
testpaths = ["housecast/tests", "housecast/grade/tests", "evalkit/tests"]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"

# .pre-commit-config.yaml is generated by apply-agentic-os-hooks.py, whose BEGIN
# and END markers are how it finds its own block. That exemption is permanent.
# Committed eval evidence quotes subject output verbatim, so a response
# containing a markdown heading reads as a stray YAML comment to a line scan.
[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml", "evaluations/**"]

# Committed eval evidence is a frozen record. Its doc pointers name
# agent-compose's evaluation documentation, which did not move in #337.
[tool.agentic-os.source-doc-refs]
excludes = ["evaluations/**"]

# Small. Pages stay short enough to read in one pass, and a subject that
# outgrows one page earns its own rather than a longer one.
[tool.agentic-os.documentation-layout]
band = "small"
excludes = ["evaluations/**"]
