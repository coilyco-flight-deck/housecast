[project]
name = "housecast"
dynamic = ["version"]
description = "Python composition engine for agent rosters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kai Ase Siren" }]
# Development Status corrects the 0.0.1 name-claim placeholder, which shipped
# `1 - Planning` because at that point there was no software behind the name.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The engine needs only a YAML parser. Everything heavier belongs to the eval
# runner, which travels with it but is not what a consumer composing a bundle
# has to install.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# The grading half is housecast.grade and the runner is evalkit. Both ride this
# extra, so a consumer composing a bundle installs neither.
eval = [
    "click>=8.1",
    "pydantic>=2.9",
    "rich>=13",
    "inspect-ai>=0.3.255",
    "openai>=2.53.0",
    # `housecast grade serve`. Both were already in the resolution as transitive
    # deps of inspect-ai, so naming them directly costs nothing new to install.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
housecast = "housecast.__main__:main"

[project.urls]
Homepage = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast"
Source = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast"
Issues = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    # starlette's TestClient is an httpx client, so the serve tests need it.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is single-sourced from the package. Keeping it in both places
# drifted twice inside one migration: the tag said 0.1.3 and the metadata said
# 0.1.1, and nothing failed because a git dependency does not check.
[tool.hatch.version]
path = "housecast/__init__.py"

[tool.hatch.build.targets.wheel]
# py.typed ships so a consumer under mypy strict gets the types rather than an
# import-untyped error. Both packages are strict-clean here.
packages = ["housecast", "evalkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["housecast", "evalkit"]

# The board coverage gate. Reporting rather than blocking on purpose: the
# grader is a human, so blocking puts every roster edit behind an annotation
# session. `agent-compose#329` decision 8 expects this to flip later.
[tool.evalkit.coverage]
blocking = false
# Run against a roster that no longer exists, so their cases orphan permanently
# rather than pending. The two ops boards were graded under the nine-seat
# roster. board-2026-08-26 is ungraded and superseded by board-2026-09-01,
# which covers all 105 cases rather than 91 (housecast#18).
retired_runs = [
    "evaluations/pilot/ops-board-2026-08-12",
    "evaluations/pilot/ops-board-2026-08-12-regraded",
    "evaluations/reflow-v3/board-2026-08-26",
]

[tool.pytest.ini_options]
testpaths = ["housecast/tests", "housecast/grade/tests", "evalkit/tests"]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"

# .pre-commit-config.yaml is generated by apply-agentic-os-hooks.py, whose BEGIN
# and END markers are how it finds its own block. That exemption is permanent.
# Committed eval evidence quotes subject output verbatim, so a response
# containing a markdown heading reads as a stray YAML comment to a line scan.
[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml", "evaluations/**"]

# Committed eval evidence is a frozen record. Its doc pointers name
# agent-compose's evaluation documentation, which did not move in #337.
[tool.agentic-os.source-doc-refs]
excludes = ["evaluations/**"]

# Small. Pages stay short enough to read in one pass, and a subject that
# outgrows one page earns its own rather than a longer one.
[tool.agentic-os.documentation-layout]
band = "small"
excludes = ["evaluations/**"]
# `excludes` governs placement and deliberately does not reach the size caps.
# A run record is evidence rather than a page: it carries verbatim subject
# output and a method, and splitting one in half to fit is how it stops being
# readable as one record.
size_excludes = ["evaluations/**"]
