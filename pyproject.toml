[project]
name = "housecast"
version = "0.0.0"
description = "Python composition engine for agent rosters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kai Siren" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Empty on purpose. The compositor and its dependencies move in
# agent-compose#337, and this scaffold declares nothing it does not use.
dependencies = []

[project.urls]
Homepage = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["housecast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["housecast", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"

# .pre-commit-config.yaml is generated by apply-agentic-os-hooks.py, whose BEGIN
# and END markers are how it finds its own block. That exemption is permanent.
[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml"]

# Small, not large. This repository ships one docs page today, and raising the
# band is a one-line edit once the compositor docs land.
[tool.agentic-os.documentation-layout]
band = "small"
